[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "zeroetl"
version = "0.2.0"
description = "Ingest CSV and pandas data into Apache Iceberg tables with PySpark."
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
keywords = ["apache-iceberg", "iceberg", "pyspark", "data-ingestion", "csv", "pandas", "etl", "data-pipeline", "upsert"]
authors = [
    {name = "Vibhu Dixit", email = "vibhu.dixit02@gmail.com"},
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "pyspark==3.5.1",
    "pandas>=2.0.0",
    "pyarrow>=15.0.0",
    "pyiceberg[pyarrow]>=0.5.0",
    "python-dotenv>=1.0.0"
]

[project.optional-dependencies]
mcp = ["mcp>=2,<3"]

[project.scripts]
zeroetl-mcp = "zeroetl.mcp_server:main"

[project.urls]
Homepage = "https://github.com/vibhu-dixit/zeroetl"
Source = "https://github.com/vibhu-dixit/zeroetl"
Documentation = "https://github.com/vibhu-dixit/zeroetl#readme"
Issues = "https://github.com/vibhu-dixit/zeroetl/issues"
